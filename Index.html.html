<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peta Zonasi dan Tanah Dijual</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#f6f7f4;--panel:#ffffff;--ink:#1f2a24;--muted:#5d6b63;--line:#dde2dc;--pin:#d9381e;--pinink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#182019;--panel:#1f2a22;--ink:#e8eee9;--muted:#9aaa9f;--line:#33423a;--pin:#ff6a4d;--pinink:#1a1a1a}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex}
#side{width:340px;max-width:100%;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:500;overflow:hidden}
#side header{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0 0 4px;font-weight:650;letter-spacing:-.01em}
header p{margin:0;font-size:13px;color:var(--muted);line-height:1.45}
.scroll{overflow:auto;flex:1;padding:6px 0 14px}
h2{font-size:13px;font-weight:650;margin:14px 18px 6px;color:var(--muted)}
.plot{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;color:inherit;padding:9px 18px;cursor:pointer;font:inherit}
.plot:hover,.plot:focus-visible{background:rgba(120,140,125,.14);outline:none}
.plot:focus-visible{box-shadow:inset 3px 0 0 var(--pin)}
.num{flex:none;width:24px;height:24px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--pin);display:grid;place-items:center;margin-top:2px}
.num b{transform:rotate(45deg);color:var(--pinink);font-size:12px}
.plot strong{display:block;font-size:14px;font-weight:600}
.plot small{display:block;color:var(--muted);font-size:12px;line-height:1.4;margin-top:1px}
.leg{display:flex;align-items:center;gap:9px;padding:5px 18px;font-size:13px;cursor:pointer}
.leg input{accent-color:var(--pin);margin:0}
.sw{width:14px;height:14px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.25)}
.leg span.c{margin-left:auto;color:var(--muted);font-size:12px}
#map{flex:1;min-width:0;background:#e9ece6}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--pin);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);display:grid;place-items:center}
.pin b{transform:rotate(45deg);color:var(--pinink);font-size:13px}
.pop{font-size:13px;line-height:1.5;min-width:210px}
.pop h3{margin:0 0 4px;font-size:15px}
.pop dl{margin:6px 0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.pop dt{color:#6b766f}.pop dd{margin:0}
.pop a{color:#0b6b4d;font-weight:600}
#toggle{display:none}
@media (max-width:760px){
 body{flex-direction:column-reverse}
 #side{width:100%;height:42%;border-right:0;border-top:1px solid var(--line)}
 #map{flex:1}
}
</style>
</head>
<body>
<aside id="side">
 <header>
  <h1>Tanah dijual dan zonasi</h1>
  <p>8 titik lokasi di atas peta zonasi Banjarbaru (289 poligon). Pilih lokasi untuk melihat zona peruntukannya.</p>
 </header>
 <div class="scroll">
  <h2>Lokasi tanah dijual</h2>
  <div id="list"></div>
  <h2>Zona peruntukan</h2>
  <div id="legend"></div>
 </div>
</aside>

const COLORS={
 'Perumahan':'#f2d64b','Perdagangan dan Jasa':'#e0453a','Perkantoran':'#3f6fd1',
 'Sarana Pelayanan Umum':'#f08a2c','Ruang Terbuka Hijau':'#4caf50','Kawasan Peruntukan Industri':'#8e5cc2',
 'Pertahanan dan Keamanan':'#6b7280','Badan Air':'#4fb7e8','Campuran':'#d9739b',
 'Peruntukan Lainnya':'#a98467','Transportasi':'#2f3e46','Pengolahan Persampahan':'#7a5c3a',
 'Hutan Lindung':'#1b5e20','Pertanian':'#b5c94a'};
const col=z=>COLORS[z]||'#999';
const fmt=n=>n.toLocaleString('id-ID',{maximumFractionDigits:2});

const map=L.map('map',{zoomControl:true}).setView([-3.418,114.745],13);
const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'});
const light=L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:20,attribution:'&copy; OpenStreetMap, &copy; CARTO'});
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri World Imagery'});
osm.addTo(map);

const groups={};
const zoneLayer=L.geoJSON(DATA.zones,{
 style:f=>({color:col(f.properties.zona),weight:1.2,fillColor:col(f.properties.zona),fillOpacity:.38}),
 onEachFeature:(f,l)=>{
  const p=f.properties;
  (groups[p.zona]=groups[p.zona]||[]).push(l);
  l.bindTooltip(p.sub,{sticky:true});
  l.bindPopup(`<div class="pop"><h3>${p.zona}</h3><dl><dt>Sub-zona</dt><dd>${p.sub}</dd><dt>Luas</dt><dd>${fmt(p.luas)} ha</dd></dl></div>`);
  l.on('mouseover',()=>l.setStyle({weight:2.5,fillOpacity:.6}));
  l.on('mouseout',()=>zoneLayer.resetStyle(l));
 }
}).addTo(map);

const markers=[];
const pts=L.layerGroup().addTo(map);
DATA.points.forEach(p=>{
 const z=p.zone?`${p.zone.zona}<br><span style="color:#6b766f">${p.zone.sub}</span>`:'Di luar area zonasi';
 const ico=L.divIcon({className:'',html:`<div class="pin"><b>${p.id}</b></div>`,iconSize:[30,30],iconAnchor:[8,30],popupAnchor:[7,-30]});
 const m=L.marker([p.lat,p.lon],{icon:ico,zIndexOffset:1000,title:'Tanah dijual '+p.id}).addTo(pts);
 m.bindPopup(`<div class="pop"><h3>Tanah dijual ${p.id}</h3><dl><dt>Koordinat</dt><dd>${p.lat}, ${p.lon}</dd><dt>Zona</dt><dd>${z}</dd></dl><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lon}">Buka di Google Maps</a></div>`);
 markers.push(m);
});

const list=document.getElementById('list');
DATA.points.forEach((p,i)=>{
 const b=document.createElement('button');b.className='plot';
 b.innerHTML=`<span class="num"><b>${p.id}</b></span><span><strong>Tanah dijual ${p.id}</strong><small>${p.zone?p.zone.sub:'Di luar area zonasi'}<br>${p.lat}, ${p.lon}</small></span>`;
 b.onclick=()=>{map.flyTo([p.lat,p.lon],17,{duration:.8});markers[i].openPopup();};
 list.appendChild(b);
});

const leg=document.getElementById('legend');
Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length).forEach(z=>{
 const l=document.createElement('label');l.className='leg';
 l.innerHTML=`<input type="checkbox" checked><span class="sw" style="background:${col(z)}"></span>${z}<span class="c">${groups[z].length}</span>`;
 l.querySelector('input').onchange=e=>groups[z].forEach(x=>e.target.checked?zoneLayer.addLayer(x):zoneLayer.removeLayer(x));
 leg.appendChild(l);
});

L.control.layers({'Peta jalan':osm,'Peta terang':light,'Citra satelit':sat},{'Zonasi':zoneLayer,'Tanah dijual':pts},{collapsed:true}).addTo(map);
L.control.scale({imperial:false}).addTo(map);
map.fitBounds(L.featureGroup(markers).getBounds().pad(.3));
</script>
